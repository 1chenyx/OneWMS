# OneWMS 发布流水线：推一个 v* tag，自动出 Windows 安装包 + 便携版并发布到 GitHub Release。
#
# 发布步骤（在本机执行）：
#   1) 把根 package.json 与 packages/desktop/src-tauri/tauri.conf.json 的 version 改成同一个新版本
#   2) git commit -am "chore: release v0.2.0"
#   3) git tag v0.2.0 ; git push ; git push --tags
#   4) 打开仓库 Actions 页看这条流水线跑完，Release 页会出现三个文件：
#        OneWMS-<版本>-setup-win-x64.exe      ← 普通用户下这个（双击安装）
#        OneWMS-<版本>-portable-win-x64.zip   ← 不想安装的解压即用
#        checksums.sha256                     ← 校验和（可选，验文件没被改过）
#
# 为什么全程 windows-latest：产物是给 Windows 用户的 exe/zip，构建脚本（build.ps1 / stage.ps1）
# 也是 PowerShell。在 Linux 上交叉编译 Tauri + NSIS 属于自找麻烦。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release 要建 Release 并上传资产

# 默认 shell 用 pwsh（PowerShell 7）：与本地开发环境一致，且没有 && 兼容问题
defaults:
  run:
    shell: pwsh

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # Tauri 的 Rust 编译最慢（首次数分钟），缓存 target/ 让后续发布快很多
      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: 安装依赖
        # npm ci 严格照 package-lock.json 装：tag 前改过依赖必须同步更新 lockfile，否则会在这一步失败
        run: npm ci

      - name: 构建桌面版（安装包 + 便携版）
        # 与本地 npm run package:desktop 完全同一条命令：构建五个工作区包 → 组装运行时载荷
        # → tauri build（NSIS 安装包）→ 组便携版 → 产物落到仓库根 dist/。
        # better-sqlite3 有 prebuild-install，CI 不需要本地编译原生模块。
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packages/desktop/build.ps1

      - name: 生成 SHA256 校验和
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          if ($files.Count -eq 0) {
            Write-Error '构建完成但 dist/ 里没有 zip/exe 产物，检查 build.ps1 的输出'
            exit 1
          }
          $lines = $files | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          }
          $lines | Set-Content -Encoding utf8 dist/checksums.sha256
          $lines | ForEach-Object { Write-Output $_ }

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 名即 Release 标题（v0.2.0），发布说明由 GitHub 按 commit 自动生成
          generate_release_notes: true
          # 匹配不到文件就让流水线失败，避免「发布成功但一个安装包都没有」
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/checksums.sha256
